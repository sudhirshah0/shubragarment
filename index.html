<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary SEO ──────────────────────────────────────────── -->
    <title>Shubra Garments — Custom Clothing & Corporate Uniforms | Dubai, UAE</title>
    <meta
      name="description"
      content="Shubra Garments is a UAE-based luxury clothing brand specializing in custom-designed coats, pants, suits, shirts, and t-shirts. Trusted by leading companies for corporate uniforms and bespoke tailoring in Dubai."
    />
    <meta
      name="keywords"
      content="custom clothing Dubai, corporate uniforms UAE, tailored suits UAE, bespoke shirts Dubai, custom t-shirts Abu Dhabi, Shubra Garments, luxury garments UAE, bulk uniforms Dubai, custom design clothing, corporate wear Middle East"
    />
    <meta name="author" content="Shubra Garments" />
    <meta name="robots" content="index, follow" />

    <!-- ── Canonical ────────────────────────────────────────────── -->
    <link rel="canonical" href="https://www.shubragarments.com/" />

    <!-- ── Open Graph (Facebook / LinkedIn) ──────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Shubra Garments — Custom Clothing & Corporate Uniforms | Dubai, UAE" />
    <meta property="og:description" content="Design your own clothing with our live custom designer. Premium coats, suits, shirts, and corporate uniforms crafted in the UAE." />
    <meta property="og:url"         content="https://www.shubragarments.com/" />
    <meta property="og:image"       content="https://www.shubragarments.com/og-image.jpg" />
    <meta property="og:site_name"   content="Shubra Garments" />
    <meta property="og:locale"      content="en_AE" />

    <!-- ── Twitter Card ─────────────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Shubra Garments — Custom Clothing & Corporate Uniforms" />
    <meta name="twitter:description" content="Design your own clothing with our live custom designer. Premium garments crafted in the UAE." />
    <meta name="twitter:image"       content="https://www.shubragarments.com/og-image.jpg" />

    <!-- ── Favicon (placeholder) ────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── Preconnect & Load Google Fonts ─────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap"
    />

    <!-- ── Preload Initial Hero LCP Image ────────────────────── -->
    <link rel="preload" as="image" href="/models/model-airline-f1.png" fetchpriority="high" />

    <!-- ── Theme colour (mobile browser chrome) ──────────────── -->
    <meta name="theme-color" content="#F7F2EC" />
  </head>
